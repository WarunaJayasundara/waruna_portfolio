# Optional: deploy to GitHub Pages on every push to main.
# Enable it in the repository under Settings → Pages → Source: "GitHub Actions".
# For a project site (username.github.io/<repo>/) BASE_PATH must be "/<repo>/".
# For a user site (username.github.io) or a custom domain, set BASE_PATH to "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Canonical links and share images point at the main domain, not this mirror.
          VITE_SITE_URL: https://warunajayasundara.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
